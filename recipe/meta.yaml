{% set name = "nncf" %}
{% set version = "3.3.0" %}
{% set python_min = "3.10" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3dbcbc1ad4f399deed139041fae1fedd4b8aa5749e30af522fcc5a6c2af73e42

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --install-option=--release

requirements:
  host:
    - pip ==22.2
    - python {{ python_min }}
    - python-build
    - setuptools >=77
    - wheel
  run:
    - networkx >=2.6,<=3.5.0
    - ninja >=1.10.0.post2,<1.14
    - numpy >=1.24.0,<2.5.0
    - openvino-telemetry >=2023.2.0
    - packaging >=20.0
    - psutil
    - pydot >=1.4.1,<=3.0.4
    - rich >=13.5.2
    - safetensors >=0.4.1
    - scikit-learn >=0.24.0
    - scipy >=1.3.2
    - tabulate >=0.9.0
    - python >={{ python_min }}
    - python-kaleido >=0.2.1
    - matplotlib >=3.3.4
    - pandas >=1.1.5,<2.4
    - pillow >=9.0.0
    - plotly_express >=0.4.1

test:
  imports:
    - nncf
    - nncf.common
    - nncf.data
    - nncf.quantization
#  commands:
#    - pip check  # won't work because conda's version of ninja does not get registered in pip - https://github.com/mesonbuild/meson-python/issues/60, https://github.com/pypa/pip/issues/11157
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/openvinotoolkit/nncf
  summary: Neural Networks Compression Framework
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sarthakpati
